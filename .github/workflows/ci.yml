name: Verify application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and scenario unit tests
        run: npm run check
      - name: Check published-browser smoke script syntax
        run: node --check tests/live-smoke.mjs && node --check tests/entry-smoke.mjs
      - name: Confirm static entrypoint exists
        run: test -f index.html && test -f styles.css && test -f src/app.js && test -f src/overview.js
      - name: Exercise preview in desktop and mobile Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          LOCAL_SITE_URL=http://127.0.0.1:8765/ node tests/entry-smoke.mjs
          LOCAL_SITE_URL=http://127.0.0.1:8765/ node tests/brief-smoke.mjs
