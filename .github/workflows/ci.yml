name: Verify application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and scenario unit tests
        run: npm run check
      - name: Confirm static entrypoint exists
        run: test -f index.html && test -f styles.css && test -f src/app.js
